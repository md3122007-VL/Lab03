<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Đăng Ký</title>
    <style>
        td:first-child {
            text-align: right;
            vertical-align: top;
            padding-right: 5px;
        }
        th {
            font-size: 24px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <th colspan="2" id="a">PHIẾU ĐĂNG KÝ</th>
            </tr>
            <tr>
                <td>Họ và tên: </td>
                <td><input type="text" name="hoten" size="40"> (*)</td>
            </tr>
            <tr>
                <td>Địa chỉ:</td>
                <td><input type="text" name="diachi" size="60"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" name="email" size="40"> (*)</td>
            </tr>
            <tr>
                <td>Giới tính:</td>
                <td>
                    <input type="radio" name="gioitinh" value="nam"> Nam 
                    <input type="radio" name="gioitinh" value="nu"> Nữ 
                </td>
            </tr>
            <tr>
                <td>Tuổi:</td>
                <td><input type="text" name="tuoi" size="10"> (*)</td>
            </tr>
            <tr>
                <td>Sở thích:</td>
                <td>
                    <label><input type="checkbox" name="sothich" value="thethao"> Thể thao</label><br>
                    <label><input type="checkbox" name="sothich" value="vanhoc"> Văn học</label><br>
                    <label><input type="checkbox" name="sothich" value="cntt"> Công nghệ thông tin</label><br>
                    <label><input type="checkbox" name="sothich" value="lichsu"> Lịch sử</label><br>
                    <label><input type="checkbox" name="sothich" value="game"> Game</label><br>
                </td>
            </tr>
            <tr>
                <td>Chuyên ngành:</td>
                <td>
                    <select name="chuyennganh">
                        <option value="web">Công nghệ Web</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Gởi hình:</td>
                <td>
                    <input type="file" name="hinhdaidien">
                </td>
            </tr>
            <tr>
                <td>Yêu cầu:</td>
                <td>
                    <textarea name="yeucau" rows="5" cols="50"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Gởi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
